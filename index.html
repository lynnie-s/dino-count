<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>章魚博士的玩具教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&display=swap">
<style>
/* Layout: 一個大舞台放會動的章魚博士，下面是用章魚當出題老師的找一找遊戲。 */
:root{
  --bg:#FFF1BF; --paper:#FFFBEA; --ink:#3B2A62; --muted:#6D5C92; --line:#EAD98E;
  --purple:#7C5CC4; --one:#D6407F; --many:#2D7BD8; --ok:#25883F; --bad:#D4443A; --sun:#FFC83A;
  --wash1:rgba(160,130,230,.30); --wash2:rgba(255,160,120,.28);
  --font-display:"Fredoka","Huninn","Noto Sans TC",sans-serif;
  --font-body:"Huninn","Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1536; --paper:#271F4D; --ink:#F6F0FF; --muted:#B9A9E0; --line:#3D3270;
    --purple:#B49CF2; --one:#FF86B3; --many:#79B7FF; --ok:#68D68C; --bad:#FF8A80;
    --wash1:rgba(150,120,255,.22); --wash2:rgba(255,140,110,.12); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1536; --paper:#271F4D; --ink:#F6F0FF; --muted:#B9A9E0; --line:#3D3270;
  --purple:#B49CF2; --one:#FF86B3; --many:#79B7FF; --ok:#68D68C; --bad:#FF8A80;
  --wash1:rgba(150,120,255,.22); --wash2:rgba(255,140,110,.12); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;padding-inline:16px}
.wrap{max-width:860px;margin-inline:auto;padding-block:14px 56px}
h1,h2{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(1.7rem,6.4vw,2.6rem);font-weight:700;letter-spacing:.02em}
.snd{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;min-height:42px;display:flex;gap:8px;align-items:center}
.snd[aria-pressed="false"]{opacity:.6}

/* stage */
.stage{position:relative;margin-top:16px;border-radius:32px;border:2px solid var(--line);padding:18px 14px 20px;overflow:hidden;
  background:radial-gradient(70% 60% at 30% 55%,var(--wash1),transparent 70%),radial-gradient(50% 50% at 88% 12%,var(--wash2),transparent 70%),var(--paper)}
.bubble{position:relative;width:fit-content;max-width:min(100%,520px);margin:0 auto 22px;background:var(--bg);border:2px solid var(--line);border-radius:22px;padding:10px 14px 10px 16px;display:flex;gap:10px;align-items:center}
.bubble::after{content:"";position:absolute;left:34%;bottom:-13px;width:22px;height:22px;background:var(--bg);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg) skew(8deg,8deg)}
.btxt{min-width:0}
.ben{font-family:var(--font-display);font-weight:600;font-size:clamp(1.15rem,4.6vw,1.6rem);line-height:1.25;overflow-wrap:anywhere}
.bzh{color:var(--muted);font-size:.92rem}
.spk{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--purple)}
.spk:hover{border-color:var(--purple)}

.actor{position:relative;width:100%;max-width:760px;margin-inline:auto;transform-origin:50% 100%;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0;display:block}
.bob{position:relative;transform-origin:50% 90%;animation:bob 3.4s ease-in-out infinite}
.bob canvas,.bob img.fb{display:block;width:100%;height:auto;aspect-ratio:920/565}
.bob img.fb{position:absolute;inset:0}
.lid{position:absolute;width:3.8%;aspect-ratio:1/1.2;border-radius:50% 50% 48% 48%;transform:translate(-50%,-50%) scaleY(0);transform-origin:50% 0;pointer-events:none;box-shadow:0 0 5px 2px var(--c);background:var(--c);border-bottom:3px solid #2C2145}
.lid.l{left:30.5%;top:43.1%;--c:#B08BC0}
.lid.r{left:38.5%;top:38.2%;--c:#AA8DAF}
.blink .lid{animation:blink .17s ease-in-out}
.shadow{width:62%;height:16px;margin:2px auto 0;border-radius:50%;background:radial-gradient(closest-side,rgba(60,35,110,.28),transparent);animation:sh 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-1.8%) rotate(.6deg)}}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.93);opacity:.8}}
@keyframes blink{0%,100%{transform:translate(-50%,-50%) scaleY(0)}50%{transform:translate(-50%,-50%) scaleY(1)}}
.jump{animation:jump .8s cubic-bezier(.3,.1,.3,1)}
@keyframes jump{0%{transform:scale(1,1)}14%{transform:scale(1.07,.9)}42%{transform:translateY(-7%) scale(.96,1.06)}70%{transform:translateY(0) scale(1.05,.94)}85%{transform:scale(.99,1.02)}100%{transform:scale(1,1)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg) translateX(-1%)}45%{transform:rotate(3deg) translateX(1%)}70%{transform:rotate(-2deg)}}
.hint{text-align:center;color:var(--muted);font-size:.92rem;margin:6px 0 0}
.fx{position:absolute;left:34%;top:46%;width:0;height:0;pointer-events:none}
.st{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;animation:fly .95s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}

/* game */
.game{margin-top:30px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.gh h2{font-size:clamp(1.3rem,5vw,1.8rem)}
.meta{display:flex;gap:14px;color:var(--muted);font-weight:600}
.stars{color:#B98500;font-family:var(--font-display)}
:root[data-theme="dark"] .stars{color:#FFD65C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stars{color:#FFD65C}}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pick{border:0;padding:0;background:none;display:flex;flex-direction:column;gap:8px;text-align:center;min-width:0}
.pick .card{border:7px solid var(--bd);border-radius:24px;background:#FFFDF8;overflow:hidden;aspect-ratio:4/3;box-shadow:0 5px 0 rgba(60,35,110,.16);transition:transform .12s}
.pick:active .card{transform:translateY(3px)}
.pick .card img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.pick:disabled{cursor:default}
.pick.right .card{outline:4px solid var(--ok);outline-offset:2px}
.tag{font-family:var(--font-display);font-weight:600;font-size:1.15rem;min-height:1.6em;overflow-wrap:anywhere}
.tag.one{color:var(--one)} .tag.many{color:var(--many)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;min-height:50px}
.btn{border:0;border-radius:999px;padding:10px 24px;min-height:48px;font-weight:700;font-size:1.05rem;color:#fff;background:var(--purple);box-shadow:0 4px 0 rgba(40,20,90,.35)}
:root[data-theme="dark"] .btn{color:#1B1536}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#1B1536}}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,20,90,.35)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>章魚博士的玩具教室</h1>
    <button class="snd" id="snd" type="button" aria-pressed="true"><span id="sndIcon"></span><span id="sndTxt">聲音開</span></button>
  </header>

  <section class="stage" id="stage" aria-label="章魚博士">
    <div class="bubble" id="bubble" aria-live="polite">
      <div class="btxt"><div class="ben" id="ben">Hello! I'm Professor Octopus.</div><div class="bzh" id="bzh">哈囉！我是章魚博士。點點我看看。</div></div>
      <button class="spk" id="bspk" type="button" aria-label="聽發音"></button>
    </div>
    <button class="actor" id="actor" type="button" aria-label="點章魚博士，牠會跳起來說話">
      <div class="bob" id="bob">
        <canvas id="oct" role="img" aria-label="戴著學士帽和圓眼鏡的紫色章魚，一隻觸手舉著小汽車，另一隻舉著積木"></canvas>
        <img class="fb" id="fb" alt="" hidden>
        <i class="lid l"></i><i class="lid r"></i>
      </div>
      <div class="shadow"></div>
    </button>
    <div class="fx" id="fx"></div>
    <p class="hint">點章魚博士，牠會跳起來說英文</p>
  </section>

  <section class="game" id="game">
    <div class="gh">
      <h2>找一找：1 個還是 many many？</h2>
      <div class="meta"><span id="prog">第 1 / 4 題</span><span class="stars" id="stars">★ 0</span></div>
    </div>
    <div class="picks" id="picks"></div>
    <div class="row"><button class="btn" id="next" type="button" hidden>下一題</button></div>
  </section>
</main>

  var FS='precision mediump float;uniform sampler2D tex;uniform float t;uniform float amp;uniform float asp;varying vec2 uv;'+
    'void main(){vec2 c=vec2(.32,.40);vec2 d=(uv-c)*vec2(asp,1.);float r=length(d);float w=smoothstep(.26,.8,r);'+
    'vec2 dir=d/max(r,.0001);vec2 perp=vec2(-dir.y,dir.x);float ph=r*9.-t*2.6+atan(d.y,d.x)*2.;'+
    'vec2 off=perp*sin(ph)*.011*w*amp+dir*sin(ph*.7+1.3)*.005*w*amp;off.x/=asp;vec4 c=texture2D(tex,uv+off);gl_FragColor=vec4(c.rgb*c.a,c.a);}';
  function sh(gl,type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
  function startGL(img){
    var cv=$('#oct');cv.width=img.naturalWidth;cv.height=img.naturalHeight;
    var gl=null;try{gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false})}catch(e){}
    if(!gl)return false;
    var pr=gl.createProgram();gl.attachShader(pr,sh(gl,gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl,gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return false;
    gl.useProgram(pr);
    var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    var tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    var uT=gl.getUniformLocation(pr,'t'),uA=gl.getUniformLocation(pr,'amp'),uS=gl.getUniformLocation(pr,'asp');
    gl.uniform1f(uS,img.naturalWidth/img.naturalHeight);
    gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);
    function draw(ms){gl.uniform1f(uT,ms/1000);gl.uniform1f(uA,reduce?0:1+energy*2.4);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
    if(reduce){draw(0);return true}
    function frame(ms){energy*=.965;draw(ms);requestAnimationFrame(frame)}
    requestAnimationFrame(frame);
    return true;
  }
  var im=new Image();
  im.onload=function(){if(!startGL(im)){var fb=$('#fb');fb.src=OCT;fb.hidden=false;$('#oct').style.visibility='hidden'}};
  im.src=OCT;

  /* ---------- game ---------- */
  var ITEMS=[
    {k:'car',one:'a car',many:'many many cars',bd:'#F08AB8',zh:'汽車'},
    {k:'robot',one:'a robot',many:'many many robots',bd:'#5AA8F0',zh:'機器人'},
    {k:'doll',one:'a doll',many:'many many dolls',bd:'#F2C23C',zh:'娃娃'},
    {k:'kite',one:'a kite',many:'many many kites',bd:'#69C060',zh:'風箏'}
  ];
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  var rounds=[],ri=0,stars=0,firstTry=true,locked=false,done=false;
  function newGame(){
    rounds=shuffle(ITEMS).map(function(it){return{it:it,ask:Math.random()<.5?'one':'many',order:Math.random()<.5?['one','many']:['many','one']}});
    ri=0;stars=0;done=false;showRound();
  }
  function showRound(){
    var r=rounds[ri],phrase=r.it[r.ask];firstTry=true;locked=false;
    $('#prog').textContent='第 '+(ri+1)+' / '+rounds.length+' 題';$('#stars').textContent='★ '+stars;
    var h='';
    r.order.forEach(function(kind){
      h+='<button class="pick" type="button" data-kind="'+kind+'" style="--bd:'+r.it.bd+'"><span class="card"><img alt="'+r.it[kind]+'" src="'+CARDS[r.it.k+(kind==='one'?'1':'3')]+'"></span><span class="tag" aria-hidden="true">&nbsp;</span></button>';
    });
    $('#picks').innerHTML=h;
    $('#next').hidden=true;
    setBubble('Find '+phrase+'!','哪一張是 '+phrase+'？');say('Find '+phrase);
  }
  $('#picks').addEventListener('click',function(e){
    var b=e.target.closest('.pick');if(!b||locked||done)return;
    var r=rounds[ri];
    if(b.dataset.kind===r.ask){
      locked=true;if(firstTry)stars++;$('#stars').textContent='★ '+stars;
      document.querySelectorAll('.pick').forEach(function(p){
        var k=p.dataset.kind,t=p.querySelector('.tag');t.textContent=r.it[k];t.className='tag '+k;t.removeAttribute('aria-hidden');
      });
      b.classList.add('right');
      var s=r.ask==='one'?"It's "+r.it.one+'.':"They're "+r.it.many.replace('many many ','')+'.';
      setBubble(s,r.ask==='one'?'1 個要用 It\'s':'many many 要用 They\'re');
      good();setTimeout(function(){say(s)},350);cheer();
      var nx=$('#next');nx.textContent=ri+1>=rounds.length?'看成績':'下一題';nx.hidden=false;
    }else{
      firstTry=false;bad();play('shake');setBubble('Oops! Try again!','再看看，數一數有幾個。');say('Try again');
    }
  });
  $('#next').addEventListener('click',function(){
    if(done){newGame();return}
    ri++;
    if(ri<rounds.length){showRound();return}
    done=true;
    setBubble('All done! You got '+stars+' stars!','全部完成！第一次就答對 '+stars+' 題。');say('All done! Great job!');cheer();
    $('#picks').innerHTML='';$('#prog').textContent='完成';
    var nx=$('#next');nx.textContent='再玩一次';nx.hidden=false;
  });
  newGame();
})();
</script>
</body>
</html>
